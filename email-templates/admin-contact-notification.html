<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Contact Message</title>
</head>
<body style="margin:0;padding:0;background:#06120c;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#e9f2ec;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {{name}} from {{country}} sent a message: {{subject}}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#06120c">
    <tr>
      <td align="center" style="padding:36px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;">
          <tr>
            <td style="border-radius:28px;overflow:hidden;background:#0c1f16;border:1px solid #1d3b2c;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td height="4" style="height:4px;background:linear-gradient(90deg,#8a6420,#f3d58a,#c9973a);">&nbsp;</td>
                </tr>
                <tr>
                  <td align="center" style="padding:40px 40px 32px;background:#08291a;">
                    <p style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#d4a443;">New contact message</p>
                    <h1 style="margin:0 0 8px;font-family:Georgia,serif;font-size:34px;color:#fff;">{{name}}</h1>
                    <p style="margin:0;font-size:15px;color:#a9c4b6;">{{country}} &bull; {{subject}}</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:28px 40px;">
                    <p style="margin:0 0 8px;font-size:12px;color:#6f8a7c;text-transform:uppercase;letter-spacing:2px;">Message</p>
                    <div style="padding:20px;border-radius:16px;background:#112b1e;border:1px solid #23462f;font-size:15px;line-height:1.8;color:#d6e8dd;">{{message}}</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 40px 36px;">
                    <p style="margin:0 0 6px;font-size:14px;"><strong style="color:#d4a443;">Email:</strong> {{email}}</p>
                    <p style="margin:0;font-size:14px;"><strong style="color:#d4a443;">Phone:</strong> {{phone}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 12px 0;font-size:11px;color:#587064;">Alif Laam Meem Academy &bull; Contact form</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
