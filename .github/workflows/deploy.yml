name: Deploy Quran Academy to Hostinger

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-24.04
    # Hostinger SSH secrets live in this GitHub environment.
    environment: CPANEL_HOST

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Verify static build output
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || {
            echo "::error::dist/index.html is missing."
            exit 1
          }

          test -d dist/assets || {
            echo "::error::dist/assets is missing."
            exit 1
          }

          echo "Static Vite build verified."

      - name: Verify deployment secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          for name in CPANEL_HOST CPANEL_USER CPANEL_SSH_PORT CPANEL_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret is missing or empty: $name"
              exit 1
            fi
          done

          if ! [[ "$CPANEL_SSH_PORT" =~ ^[0-9]+$ ]] ||
             [ "$CPANEL_SSH_PORT" -lt 1 ] ||
             [ "$CPANEL_SSH_PORT" -gt 65535 ]; then
            echo "::error::CPANEL_SSH_PORT must be a valid port number."
            exit 1
          fi

          echo "Deployment secrets verified."

      - name: Configure SSH host verification
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load SSH private key
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail
          # Normalise the key: strip Windows CRLF / stray spaces and make sure it
          # ends with a newline (keys copied on Windows often break ssh-add).
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null; then
            echo "::error::CPANEL_SSH_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."
            head -c 40 "$HOME/.ssh/deploy_key" | sed 's/[A-Za-z0-9+\/=]\{8,\}/<redacted>/g'
            exit 1
          fi
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/deploy_key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Verify SSH and document root
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: /home/u357349865/domains/aliflaammeeminstitute.online/public_html
        run: |
          set -euo pipefail

          ssh \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "test -d '${DEPLOY_PATH}' && test -w '${DEPLOY_PATH}'"

          echo "SSH access and document root verified."

      - name: Detect changed pages for IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs detect

      - name: Write WhatsApp alert config
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          python3 - <<'PY'
          import os, re
          phone = re.sub(r'[^0-9+]', '', os.environ.get('WHATSAPP_PHONE', ''))
          key = re.sub(r'[^0-9A-Za-z]', '', os.environ.get('WHATSAPP_APIKEY', ''))
          if phone and key:
              open('dist/api/_wa_config.php', 'w').write(
                  "<?php return array('phone' => '%s', 'apikey' => '%s');\n" % (phone, key))
              print('WhatsApp alerts enabled for', phone[:5] + '...')
          else:
              print('WhatsApp secrets not set - alerts disabled (email still works).')
          PY

      - name: Deploy website files using SFTP
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: /home/u357349865/domains/aliflaammeeminstitute.online/public_html
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess
          test -f dist/404.html

          sftp \
            -P "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${CPANEL_USER}@${CPANEL_HOST}" <<SFTP
          cd ${DEPLOY_PATH}
          put -r dist/* .
          put dist/.htaccess .htaccess
          SFTP

          echo "SFTP deployment completed successfully."

      - name: Notify Bing via IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
