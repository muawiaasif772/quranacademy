
name: Deploy Quran Academy to cPanel

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Verify static build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html is missing after build."
            exit 1
          fi

          if [ ! -d dist/assets ]; then
            echo "ERROR: dist/assets is missing after build."
            exit 1
          fi

          echo "Static Vite build verified."

      - name: Verify deployment secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          for name in CPANEL_HOST CPANEL_USER CPANEL_SSH_PORT CPANEL_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret is missing or empty: $name"
              exit 1
            fi
          done

          if ! [[ "$CPANEL_SSH_PORT" =~ ^[0-9]+$ ]] ||
             [ "$CPANEL_SSH_PORT" -lt 1 ] ||
             [ "$CPANEL_SSH_PORT" -gt 65535 ]; then
            echo "::error::CPANEL_SSH_PORT must be a valid port number."
            exit 1
          fi

          echo "Required deployment secrets are available."

      - name: Configure SSH
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}

      - name: Verify SSH connection and document root
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: /home/alifazwr/public_html
        run: |
          set -euo pipefail

          ssh \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "test -d '${CPANEL_DEPLOY_PATH}' && test -w '${CPANEL_DEPLOY_PATH}'"

          echo "SSH connection and document root verified."

      - name: Deploy static files to cPanel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: /home/alifazwr/public_html
        run: |
          set -euo pipefail

          rsync -az \
            --omit-dir-times \
            --no-perms \
            --no-group \
            --no-owner \
            -e "ssh -p ${CPANEL_SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            "${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_DEPLOY_PATH}/"

          echo "Deployment files transferred successfully."
