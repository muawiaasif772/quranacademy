name: Deploy Quran Academy to cPanel

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Verify static build output
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || {
            echo "::error::dist/index.html is missing."
            exit 1
          }

          test -d dist/assets || {
            echo "::error::dist/assets is missing."
            exit 1
          }

          echo "Static Vite build verified."

      - name: Verify deployment secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          for name in CPANEL_HOST CPANEL_USER CPANEL_SSH_PORT CPANEL_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret is missing or empty: $name"
              exit 1
            fi
          done

          if ! [[ "$CPANEL_SSH_PORT" =~ ^[0-9]+$ ]] ||
             [ "$CPANEL_SSH_PORT" -lt 1 ] ||
             [ "$CPANEL_SSH_PORT" -gt 65535 ]; then
            echo "::error::CPANEL_SSH_PORT must be a valid port number."
            exit 1
          fi

          echo "Deployment secrets verified."

      - name: Configure SSH host verification
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan -p "$CPANEL_SSH_PORT" "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Verify SSH and document root
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: /home/alifazwr/public_html
        run: |
          set -euo pipefail

          ssh \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${CPANEL_USER}@${CPANEL_HOST}" \
            "test -d '${CPANEL_DEPLOY_PATH}' && test -w '${CPANEL_DEPLOY_PATH}'"

          echo "SSH access and document root verified."

      - name: Deploy website files using SFTP
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: /home/alifazwr/public_html
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess

          sftp \
            -P "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${CPANEL_USER}@${CPANEL_HOST}" <<SFTP
          cd ${CPANEL_DEPLOY_PATH}
          put -r dist/* .
          put dist/.htaccess .htaccess
          SFTP

          echo "SFTP deployment completed successfully."
