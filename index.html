<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noor Alif Lam Meem | Learn Quran & Arabic Online</title>
    <meta name="description" content="Join Noor Al-Quran Academy for personalized 1-on-1 online Quran, Tajweed, and Arabic classes for kids and adults. Book your free trial today!" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', sans-serif;
      }
      .arabic-font {
        font-family: 'Amiri', serif;
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 6s linear infinite;
      }
      @keyframes glow {
        0%, 100% { opacity: 0.5; filter: blur(20px); }
        50% { opacity: 0.8; filter: blur(30px); }
      }
      .animate-glow {
        animation: glow 4s ease-in-out infinite;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      html {
        scroll-behavior: smooth;
      }

      /* ─────────────────────────────────────────── RESPONSIVE UTILITIES ───────── */
      @media (max-width: 640px) {
        body { font-size: 14px; }
        h1 { font-size: clamp(24px, 6vw, 40px) !important; }
        h2 { font-size: clamp(20px, 5vw, 32px) !important; }
        h3 { font-size: clamp(16px, 4vw, 24px) !important; }
      }
      
      @media (max-width: 768px) {
        * { box-sizing: border-box; }
        img { max-width: 100%; height: auto; }
      }

      /* Prevent horizontal overflow on mobile */
      @media (max-width: 480px) {
        body { overflow-x: hidden; }
        .max-w-any { max-width: 100vw; padding: 0 12px; }
      }

      /* Touch-friendly buttons on mobile */
      @media (hover: none) and (pointer: coarse) {
        button, a[role="button"] {
          min-height: 44px;
          min-width: 44px;
        }
      }

      /* Improve text readability */
      @media (max-width: 640px) {
        p { line-height: 1.6; }
        li { line-height: 1.6; }
      }
    </style>
